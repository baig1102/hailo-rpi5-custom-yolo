name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Plain Ubuntu without Hailo software: everything tested here must run without hailo_platform.
    runs-on: ubuntu-latest
    # A stuck test (e.g. a retry loop) must fail the job, not burn the default 6 hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the Pi's system Python on Bookworm; 3.12 keeps the code ready for the next OS.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
